name: Sunday Desk updater

# Runs on GitHub's servers, not on a laptop. Each run refreshes lines, injuries, weather,
# starters, ratings, and the prediction ledger, then commits the data back; the page reads
# it straight from GitHub.
#
# The punctual clock is Netlify's: netlify/functions/kick-updater.mjs asks for a run
# (workflow_dispatch) at every wanted Chicago time, game days included, and GitHub starts a
# requested run within seconds. The two schedules below are only a fallback in case that
# function is ever off; GitHub's own schedule can run hours late, and minute 17 avoids the
# top-of-the-hour crowd.
on:
  schedule:
    - cron: "17 15 * * *"        # fallback, 10:17 AM Chicago in daylight time
    - cron: "17 22 * * *"        # fallback, 5:17 PM Chicago in daylight time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache play-by-play downloads
        uses: actions/cache@v4
        with:
          path: data/pbp
          key: pbp-v1-${{ hashFiles('ratings.py') }}
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Collect picks saved in the app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PICKERS: ${{ secrets.PICKERS }}
        run: python picks_form.py
      - name: Fetch CBS expert picks for the current week
        run: python cbs_picks.py
      - name: Refresh forecasts, ledger, and scorecard
        run: python update.py --season 2026
      - name: Refresh ratings from play-by-play
        run: python ratings.py --current 2026
      - name: Commit the data
        run: |
          git config user.name "sunday-desk-updater"
          git config user.email "updater@users.noreply.github.com"
          git add picks.json data/snapshot.json data/ledger.json data/ratings-current.json data/location-cache.json data/preparation-history.json data/depth-charts.json data/picks-status.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Refresh forecasts $(date -u +'%Y-%m-%d %H:%MZ')" && git push)
