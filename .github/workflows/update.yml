name: Sunday Desk updater

# Runs on GitHub's servers, not on a laptop. Each run refreshes lines, injuries, weather,
# starters, ratings, and the prediction ledger, then commits the data back; the page reads
# it straight from GitHub. Times below are UTC. Minutes sit off the hour on purpose: GitHub
# delays or drops top-of-the-hour schedules when it is busy, and any run can still land
# late, so game-day looks are placed after the inactive lists (90 minutes before kickoff)
# with a second look an hour later for once daylight time ends (Chicago moves one hour).
on:
  schedule:
    - cron: "17 15 * * *"        # every day, 10:17 AM Chicago
    - cron: "17 22 * * *"        # every day, 5:17 PM Chicago, before the night games' inactives
    - cron: "17 13 * * 0"        # Sunday 8:17 AM, for the morning kickoffs played abroad
    - cron: "47 16 * * 0"        # Sunday 11:47 AM, after the noon games' inactive lists
    - cron: "47 19 * * 0"        # Sunday 2:47 PM, after the 3:25 games' inactive lists
    - cron: "47 20 * * 0"        # Sunday 3:47 PM, the same look once daylight time ends
    - cron: "17 23 * * 0,1,4"    # Sun/Mon/Thu 6:17 PM, after the night game's inactive list
    - cron: "17 0 * * 1,2,5"     # the same look once daylight time ends (UTC has rolled to the next day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache play-by-play downloads
        uses: actions/cache@v4
        with:
          path: data/pbp
          key: pbp-v1-${{ hashFiles('ratings.py') }}
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Collect picks saved in the app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: python picks_form.py
      - name: Fetch CBS expert picks for the current week
        run: python cbs_picks.py
      - name: Refresh forecasts, ledger, and scorecard
        run: python update.py --season 2026
      - name: Refresh ratings from play-by-play
        run: python ratings.py --current 2026
      - name: Commit the data
        run: |
          git config user.name "sunday-desk-updater"
          git config user.email "updater@users.noreply.github.com"
          git add picks.json data/snapshot.json data/ledger.json data/ratings-current.json data/location-cache.json data/preparation-history.json data/depth-charts.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Refresh forecasts $(date -u +'%Y-%m-%d %H:%MZ')" && git push)
