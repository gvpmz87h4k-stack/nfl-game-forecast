[build]
  # Serve only the page and its data. The build copies them into site/; the Python, tests,
  # and configuration stay in the repository and never reach the public site.
  publish = "site"
  # Netlify charges credits per production deploy, so only build when the page itself changed.
  # The twice-daily data commits do not trigger a build; the page reads fresh data from GitHub.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html app.js styles.css site.webmanifest icons netlify.toml"
  command = "rm -rf site && mkdir -p site/data && cp index.html app.js styles.css site.webmanifest site/ && cp -R icons site/icons && cp data/*.json site/data/"

# The data files change several times a week; never let a browser cache them.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
